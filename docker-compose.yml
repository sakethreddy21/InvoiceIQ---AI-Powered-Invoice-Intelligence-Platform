services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoiceiq
      POSTGRES_USER: invoiceiq
      POSTGRES_PASSWORD: invoiceiq
    ports:
      - "5433:5432"
    volumes:
      - invoiceiq-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceiq -d invoiceiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  invoiceiq-postgres:
